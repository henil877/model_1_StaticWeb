<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail - BloomShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; padding: 30px; }

    .pd-container {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: flex-start;
      max-width: 1100px;
      margin: 0 auto;
    }

    .left-section { width: 45%; }
    .back { display: flex; align-items: center; gap: 8px; color: #666; margin-bottom: 25px; font-size: 14px; }
    .back a { text-decoration: none; color: #666; }
    .back a:hover { color: orange; }

    .product-image { width: 100%; height: 480px; overflow: hidden; border-radius: 20px; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; }

    .right-section { margin-top: 10px; width: 50%; }
    .right-section h1 { font-size: 32px; margin-bottom: 15px; color: #222; }

    .rating { display: flex; align-items: center; gap: 5px; color: orange; margin-bottom: 18px; font-size: 14px; }
    .rating .rev { color: #666; margin-left: 8px; font-size: 16px; }

    .right-section h2 { font-size: 38px; margin-bottom: 20px; color: #111; }
    .description { font-size: 18px; line-height: 1.6; color: #666; margin-bottom: 30px; }
    hr { border: none; border-top: 1px solid #ddd; margin-bottom: 30px; }

    .quantity-section h3 { font-size: 20px; margin-bottom: 15px; }
    .quantity-box { width: 160px; height: 50px; border: 1px solid #ddd; border-radius: 30px; display: flex; align-items: center; justify-content: space-around; margin-bottom: 30px; background: white; }
    .quantity-box button { border: none; background: transparent; font-size: 22px; cursor: pointer; color: #666; padding: 0 10px; }
    .quantity-box span { font-size: 18px; }

    .buttons { display: flex; gap: 15px; margin-bottom: 25px; }
    .cart-btn, .buy-btn { flex: 1; height: 55px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; transition: 0.3s; }
    .cart-btn { background: #f6a300; color: black; }
    .cart-btn i { margin-right: 8px; }
    .cart-btn:hover { background: #df9200; }
    .buy-btn { background: white; border: 1px solid #ddd; }
    .buy-btn:hover { background: #f0f0f0; }

    .bottom-links { display: flex; gap: 40px; color: #666; font-size: 16px; }
    .bottom-links div { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .nav-pills .nav-link { background: #f1f1f1; color: #000; margin-right: 10px; border-radius: 30px; padding: 10px 20px; font-weight: 600; }
    .nav-pills .nav-link.active { background: #f5a300 !important; color: #fff !important; }
    .tab-content { margin-bottom: 25px; color: #555; line-height: 28px; font-size: 17px; }
    .tab-content ul { padding-left: 20px; }

    .loading-state { display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 20px; color: #888; }
    .not-found { text-align: center; padding: 80px 20px; }
    .not-found h2 { color: #e55; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div id="loadingState" class="loading-state">
    <i class="fa-solid fa-spinner fa-spin" style="margin-right:10px;color:orange;"></i> Loading product...
  </div>

  <div id="productContent" style="display:none;">
    <div class="pd-container">

      <div class="left-section">
        <div class="back">
          <i class="fa-solid fa-arrow-left"></i>
          <a href="index.html">Return to Shop</a>
        </div>
        <div class="product-image">
          <img id="prodImg" src="" alt="Product Image">
        </div>
      </div>

      <div class="right-section">
        <h1 id="prodName"></h1>
        <div class="rating">
          <span id="prodStars"></span>
          <span class="rev" id="prodReviews"></span>
        </div>
        <h2 id="prodPrice"></h2>
        <p class="description" id="prodShortDesc"></p>
        <hr>

        <ul class="nav nav-pills mb-3 mt-4" id="pills-tab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-description" type="button">Description</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-rating" type="button">Rating</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-features" type="button">Features</button>
          </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
          <div class="tab-pane fade show active" id="pills-description">
            <p class="mt-3" id="tabDescription"></p>
          </div>
          <div class="tab-pane fade" id="pills-rating">
            <p class="mt-3" id="tabRating"></p>
            <p id="tabRatingDetail"></p>
          </div>
          <div class="tab-pane fade" id="pills-features">
            <ul class="mt-3" id="tabFeatures"></ul>
          </div>
        </div>

        <div class="quantity-section">
          <h3>Quantity</h3>
          <div class="quantity-box">
            <button id="qtyMinus">−</button>
            <span id="qtyValue">1</span>
            <button id="qtyPlus">+</button>
          </div>
        </div>

        <div class="buttons">
          <button class="cart-btn" id="addCartBtn">
            <i class="fa-solid fa-cart-shopping"></i> Add to Cart
          </button>
          <button class="buy-btn" id="buyNowBtn">Buy Now</button>
        </div>

        <div class="bottom-links">
          <div><i class="fa-regular fa-heart"></i> <span>Add to Wishlist</span></div>
          <div><i class="fa-solid fa-share-nodes"></i> <span>Share</span></div>
        </div>
      </div>

    </div>
  </div>

  <div id="notFound" class="not-found" style="display:none;">
    <h2>Product Not Found</h2>
    <p>The product you are looking for does not exist.</p>
    <a href="index.html" style="color:orange;font-size:18px;">← Back to Shop</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>

    var products = {
      1: {
        name: "AirFlex Runner", price: 8536, priceDisplay: "Rs. 8,536.00",
        image: "images/img1.avif", rating: 4.8, reviews: "127 reviews",
        shortDesc: "Lightweight running sneakers designed for speed and comfort. Breathable mesh and durable sole.",
        description: "Lightweight running sneakers designed for speed and comfort. Breathable mesh material with premium cushioning sole. Perfect for daily runs and casual outings.",
        ratingText: "⭐⭐⭐⭐⭐ 4.8/5 Rating",
        ratingDetail: "127+ happy customer reviews with excellent comfort and quality.",
        features: ["Premium Air Cushion Sole", "Breathable Mesh Fabric", "Lightweight Design", "Perfect for Running & Casual Wear"]
      },
      2: {
        name: "Urban Street Pro", price: 9440, priceDisplay: "Rs. 9,440.00",
        image: "images/img2.avif", rating: 4.6, reviews: "98 reviews",
        shortDesc: "Bold street-style sneakers built for the city. Durable and trendy for everyday urban wear.",
        description: "Bold street-style sneakers built for the city. Crafted with premium materials and a chunky sole for that authentic street look.",
        ratingText: "⭐⭐⭐⭐⭐ 4.6/5 Rating",
        ratingDetail: "98+ happy customer reviews praising style and durability.",
        features: ["Chunky Street Sole", "Premium Synthetic Upper", "Padded Collar for Comfort", "Trendy Urban Design"]
      },
      3: {
        name: "Classic Court 90s", price: 7550, priceDisplay: "Rs. 7,550.00",
        image: "images/img3.avif", rating: 4.5, reviews: "84 reviews",
        shortDesc: "Retro 90s court style with modern comfort. A timeless silhouette for every outfit.",
        description: "Retro 90s court style with modern comfort and fit. A timeless silhouette that pairs with every outfit. Clean leather-look upper with vintage sole.",
        ratingText: "⭐⭐⭐⭐⭐ 4.5/5 Rating",
        ratingDetail: "84+ happy customers love the classic retro look and daily comfort.",
        features: ["Retro 90s Silhouette", "Clean Leather-Look Upper", "Vintage Rubber Sole", "Versatile for All Outfits"]
      },
      4: {
        name: "Volt Edge", price: 19086, priceDisplay: "Rs. 19,086.00",
        image: "images/img4.avif", rating: 4.9, reviews: "213 reviews",
        shortDesc: "High-performance sneakers with aggressive volt styling. Maximum energy return.",
        description: "High-performance sneakers with aggressive volt styling and reactive foam. Designed for athletes who push limits. Maximum energy return in every stride.",
        ratingText: "⭐⭐⭐⭐⭐ 4.9/5 Rating",
        ratingDetail: "213+ athletes swear by the Volt Edge for its unmatched energy return.",
        features: ["Reactive Foam Midsole", "High-Grip Rubber Outsole", "Dynamic Lace System", "Aggressive Volt Colorway"]
      },
      5: {
        name: "Zenith Flow", price: 12372, priceDisplay: "Rs. 12,372.00",
        image: "images/img5.avif", rating: 4.7, reviews: "156 reviews",
        shortDesc: "Cloud-like cushioning for all-day wear. Seamless knit upper with flexible flow sole.",
        description: "Cloud-like cushioning for all-day wear. Seamless knit upper adapts to your foot shape while the flexible flow sole provides effortless movement.",
        ratingText: "⭐⭐⭐⭐⭐ 4.7/5 Rating",
        ratingDetail: "156+ reviewers describe wearing Zenith Flow as 'walking on clouds'.",
        features: ["Seamless Knit Upper", "Cloud-Foam Midsole", "Flexible Flow Outsole", "All-Day Comfort Design"]
      },
      6: {
        name: "Street Vibe Low", price: 6617, priceDisplay: "Rs. 6,617.00",
        image: "images/img6.avif", rating: 4.3, reviews: "72 reviews",
        shortDesc: "Low-top street style at an accessible price. Casual, comfortable, and always on trend.",
        description: "Low-top street style at an accessible price. Canvas upper with rubber cupsole for everyday casual wear.",
        ratingText: "⭐⭐⭐⭐ 4.3/5 Rating",
        ratingDetail: "72+ customers love the value and everyday versatility.",
        features: ["Low-Top Silhouette", "Canvas Upper", "Rubber Cupsole", "Budget-Friendly Street Style"]
      },
      7: {
        name: "Nova Horizon", price: 10453, priceDisplay: "Rs. 10,453.00",
        image: "images/img7.avif", rating: 4.6, reviews: "109 reviews",
        shortDesc: "Trail-inspired runner with bold horizon colorway. Ready for road and light trail.",
        description: "Trail-inspired runner with bold horizon colorway. Multi-directional lug outsole with responsive midsole for adventure.",
        ratingText: "⭐⭐⭐⭐⭐ 4.6/5 Rating",
        ratingDetail: "109+ adventurers recommend Nova Horizon for its versatility.",
        features: ["Multi-Directional Lug Outsole", "Trail-Ready Build", "Responsive Midsole", "Bold Horizon Colorway"]
      },
      8: {
        name: "Pulse React", price: 9440, priceDisplay: "Rs. 9,440.00",
        image: "images/img8.avif", rating: 4.5, reviews: "91 reviews",
        shortDesc: "Reactive cushioning that pulses back with every step. Built for speed and energy.",
        description: "Reactive cushioning that pulses back with every step. Built for speed and sustained energy return. Engineered mesh upper with dynamic support frame.",
        ratingText: "⭐⭐⭐⭐⭐ 4.5/5 Rating",
        ratingDetail: "91+ runners say the Pulse React transforms their daily run.",
        features: ["React Foam Technology", "Engineered Mesh Upper", "Dynamic Support Frame", "Speed-Focused Design"]
      },
      9: {
        name: "Core Street Retro", price: 8152, priceDisplay: "Rs. 8,152.00",
        image: "images/img9.avif", rating: 4.4, reviews: "67 reviews",
        shortDesc: "Heritage street style reimagined for today. Classic retro look with modern comfort.",
        description: "Heritage street style reimagined for today. Suede and mesh upper on a vulcanized-style sole with modern comfort insole.",
        ratingText: "⭐⭐⭐⭐ 4.4/5 Rating",
        ratingDetail: "67+ customers love the retro aesthetic with daily wearability.",
        features: ["Suede & Mesh Upper", "Retro Vulcanized Sole", "Heritage Colorways", "Modern Comfort Insole"]
      }
    };

    // Read ?id= from URL
    var params = new URLSearchParams(window.location.search);
    var id = parseInt(params.get("id"));
    var product = products[id];

    if (!product) {
      document.getElementById("loadingState").style.display = "none";
      document.getElementById("notFound").style.display = "block";
    } else {
      // Populate immediately (no need to wait for jQuery ready)
      document.title = product.name + " - BloomShop";
      document.getElementById("prodImg").src = product.image;
      document.getElementById("prodImg").alt = product.name;
      document.getElementById("prodName").textContent = product.name;
      document.getElementById("prodPrice").textContent = product.priceDisplay;
      document.getElementById("prodShortDesc").textContent = product.shortDesc;
      document.getElementById("tabDescription").textContent = product.description;
      document.getElementById("tabRating").textContent = product.ratingText;
      document.getElementById("tabRatingDetail").textContent = product.ratingDetail;

      // Stars
      var fullStars = Math.floor(product.rating);
      var starsHtml = "";
      for (var i = 0; i < fullStars; i++) starsHtml += '<i class="fa-solid fa-star"></i>';
      if (product.rating % 1 >= 0.5) starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
      document.getElementById("prodStars").innerHTML = starsHtml;
      document.getElementById("prodReviews").textContent = "(" + product.rating + ") • " + product.reviews;

      // Features
      var featList = document.getElementById("tabFeatures");
      product.features.forEach(function(f) {
        var li = document.createElement("li");
        li.textContent = f;
        featList.appendChild(li);
      });

      document.getElementById("loadingState").style.display = "none";
      document.getElementById("productContent").style.display = "block";

      // Quantity
      var qty = 1;
      document.getElementById("qtyPlus").onclick = function() { qty++; document.getElementById("qtyValue").textContent = qty; };
      document.getElementById("qtyMinus").onclick = function() { if (qty > 1) { qty--; document.getElementById("qtyValue").textContent = qty; } };

      // Add to Cart
      document.getElementById("addCartBtn").onclick = function() {
        var cart = JSON.parse(localStorage.getItem("cart")) || [];
        var existing = cart.find(function(item) { return item.name === product.name; });
        if (existing) { existing.qty += qty; } else { cart.push({ name: product.name, price: product.price, image: product.image, qty: qty }); }
        localStorage.setItem("cart", JSON.stringify(cart));
        alert(qty + " x " + product.name + " added to cart!");
      };

      // Buy Now
      document.getElementById("buyNowBtn").onclick = function() {
        var cart = JSON.parse(localStorage.getItem("cart")) || [];
        var existing = cart.find(function(item) { return item.name === product.name; });
        if (existing) { existing.qty += qty; } else { cart.push({ name: product.name, price: product.price, image: product.image, qty: qty }); }
        localStorage.setItem("cart", JSON.stringify(cart));
        window.location.href = "cart.html";
      };
    }

    // Load header separately (jQuery needed for .load)
    $(document).ready(function() {
      $("#pageHeader").load("header.html");
    });
  </script>
</body>
</html>
