<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Page</title>
  <link rel="stylesheet" href="productdetail1.css" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body>

  <div class="container">

    <!-- Left Side -->
    <div class="left-section">

      <div class="back">
        <i class="fa-solid fa-arrow-left"></i>
        <a href="index.html"><span>Return to Shop</span></a>
      </div>

      <div class="product-image">
        <img src="images/img1.avif">
      </div>

    </div>

    <!-- Right Side -->
    <div class="right-section">

      <h1>AirFlex Runner</h1>

      <div class="rating">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>

        <span>(4.8) • 127 reviews</span>
      </div>

      <h2>$89.00</h2>

      <p class="description">
        Lightweight running sneakers designed for speed and comfort.
        Breathable mesh and durable sole.
      </p>

      <hr>

      <div class="quantity-section">
        <h3>Quantity</h3>

        <div class="quantity-box">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>
      </div>

      <div class="buttons">

        <button class="cart-btn">
          <i class="fa-solid fa-cart-shopping"></i>
          Add to Cart
        </button>

        <button class="buy-btn">
          Buy Now
        </button>

      </div>

      <div class="bottom-links">

        <div>
          <i class="fa-regular fa-heart"></i>
          <span>Add to Wishlist</span>
        </div>

        <div>
          <i class="fa-solid fa-share-nodes"></i>
          <span>Share</span>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
